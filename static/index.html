<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Comparison Agent</title>
<style>
:root{--bg:#f4f7f5;--card:rgba(255,255,255,.88);--text:#10201a;--muted:#65746e;--line:#dfe7e3;--accent:#087f5b;--accent2:#19a974;--best:#e9f8f1;--shadow:0 18px 50px rgba(20,45,35,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1210;--card:rgba(20,30,26,.9);--text:#edf7f2;--muted:#9aa9a2;--line:#2b3832;--accent:#45d39e;--accent2:#78e6bc;--best:#12352a;--shadow:0 18px 50px rgba(0,0,0,.28)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(25,169,116,.12),transparent 35%),var(--bg);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:28px 18px 48px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:8px 0 22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:900;box-shadow:0 10px 24px rgba(8,127,91,.22)}h1{font-size:1.7rem;letter-spacing:-.03em;margin:0}.subtitle{color:var(--muted);margin:2px 0 0}.live{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--accent);background:var(--card)}
.search{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}form{display:grid;gap:10px}.line{display:flex;gap:10px}.line+.line{align-items:center}input{flex:1;min-width:0;padding:13px 14px;font-size:1rem;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);transition:.2s}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(8,127,91,.1);outline:0}button,a.open{padding:13px 18px;font-size:.96rem;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,opacity .15s}button:hover,a.open:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(8,127,91,.18)}button:disabled{opacity:.6;cursor:wait;transform:none}.alt{background:transparent!important;color:var(--accent)!important;border:1px solid var(--accent)!important;padding:9px 12px;font-size:.88rem}.hint{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--card)}
#status{margin:18px 4px;color:var(--muted);min-height:24px}.statusbar{display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}#status.error{color:#c0392b}
#out,#insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(20,45,35,.05);animation:rise .3s ease both}.best{background:var(--best);border-color:var(--accent);grid-column:1/-1}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.card h2{font-size:1rem;margin:0 0 7px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.site{font-weight:700}.price{font-size:1.3rem;font-weight:800}.muted{color:var(--muted);font-size:.88rem}.oos{color:#c0392b;font-size:.88rem}ul{margin:8px 0;padding-left:20px}a.open{display:inline-block;margin-top:9px;padding:8px 12px;font-size:.84rem}.history{grid-column:1/-1}.history h2{font-size:1rem}.history svg{display:block;width:100%;height:100px;margin-top:10px}.history .spark{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.history .grid{stroke:var(--line);stroke-width:1}.history circle{fill:var(--card);stroke:var(--accent);stroke-width:2}.caption{display:flex;justify-content:space-between;gap:12px;margin-top:4px}#ins{margin:18px 0 0}.footer{margin-top:24px;color:var(--muted);font-size:.78rem;text-align:center}
@media(max-width:620px){main{padding:18px 12px 34px}.hero{align-items:center}.live{display:none}.line{flex-direction:column}.line:last-of-type{flex-direction:row}.line button{width:100%}h1{font-size:1.45rem}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header class="hero"><div class="brand"><div class="logo">PA</div><div><h1>PriceAgent</h1><div class="subtitle">Live price intelligence across stores</div></div></div><div class="live">● Live search</div></header>
  <section class="search"><form id="form">
    <div class="line">
      <input id="q" type="text" minlength="3" maxlength="120" required
             placeholder="Product, e.g. iPhone 15 128GB Black" aria-label="Product name">
      <button id="go" type="submit">Compare</button>
    </div>
    <div class="line">
      <input id="country" type="text" minlength="2" maxlength="60" required aria-label="Country" placeholder="Country">
      <input id="city" type="text" maxlength="60" aria-label="City or area (optional)" placeholder="City or area (optional)">
    </div>
    <button id="loc" type="button" class="alt">Use my location</button>
  </form><div class="hint"><span class="chip">Real-time store discovery</span><span class="chip">Effective price comparison</span><span class="chip">90-day history</span></div></section>
  <div id="status" role="status"></div>
  <div id="out"></div>
  <button id="ins" type="button" class="alt" hidden>Why buy this? Reviews and similar products</button>
  <div id="insights"></div>
  <p class="footer">Stores are discovered for your region. Prices change quickly and some stores block automated checks, so confirm on the store before buying.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const form = $("form"), q = $("q"), country = $("country"), city = $("city"),
      go = $("go"), status = $("status"), out = $("out");

// Helper: create an element with text set safely via textContent (never innerHTML).
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

// Region: restore saved choice, else guess the country from the browser locale (e.g. en-IN -> India).
try {
  country.value = localStorage.getItem("pa_country") || "";
  city.value = localStorage.getItem("pa_city") || "";
} catch (e) {}
if (!country.value) {
  try {
    const m = (navigator.language || "").match(/-([A-Za-z]{2})$/);
    if (m) country.value = new Intl.DisplayNames(["en"], {type: "region"}).of(m[1].toUpperCase()) || "";
  } catch (e) {}
}

// No country yet (no saved value, no locale region): ask the user, or offer device location.
if (!country.value) {
  status.textContent = "Enter your country, or tap Use my location.";
  country.focus();
}

// "Use my location": browser geolocation (GPS on phones) -> server turns it into country + city.
// Needs HTTPS (or localhost) and the user's permission. Coordinates are rounded before sending.
$("loc").addEventListener("click", () => {
  if (!navigator.geolocation) { status.textContent = "This browser cannot share location. Type your country and city."; return; }
  status.className = ""; status.textContent = "Asking your device for your location…";
  navigator.geolocation.getCurrentPosition(async pos => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try {
      const qs = "lat=" + pos.coords.latitude.toFixed(2) + "&lon=" + pos.coords.longitude.toFixed(2);
      const res = await fetch("/api/locate?" + qs, {
        signal: controller.signal,
        headers: {"Accept": "application/json"}
      });
      const d = await res.json().catch(() => ({}));
      if (res.status === 429) throw new Error("Location lookup limit reached. You can type your country and city instead.");
      if (res.status === 503) throw new Error("Location service is temporarily unavailable. You can type your country and city instead.");
      if (!res.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Location lookup failed.");
      if (!d.country) throw new Error("No country was found for this location. Please type it instead.");
      country.value = d.country; city.value = d.city || "";
      status.className = "";
      status.textContent = "Location set to " + [d.city, d.country].filter(Boolean).join(", ") + ". Edit it if it looks wrong.";
    } catch (err) {
      status.className = "error";
      status.textContent = err.name === "AbortError"
        ? "Location lookup took too long. Please type your country and city instead."
        : (err.message || "Could not detect your location. Please type your country and city instead.");
    } finally {
      clearTimeout(timer);
    }
  }, err => {
    status.className = "error";
    status.textContent = (err.code === 1 ? "Location permission was denied." : "Could not detect your location.") + " Type your country and city instead.";
  }, {timeout: 10000, maximumAge: 600000});
});

// Format money using the currency code returned by the server (falls back safely).
function money(n, cur) {
  if (typeof n !== "number" || !isFinite(n)) return "n/a";
  cur = /^[A-Z]{3}$/.test(cur || "") ? cur : null;
  try {
    return new Intl.NumberFormat(undefined, cur ? {style: "currency", currency: cur, maximumFractionDigits: 0} : {}).format(n);
  } catch (e) { return (cur || "") + " " + n; }
}

function render(data) {
  out.replaceChildren();
  const cur = data.currency;
  const results = Array.isArray(data.results) ? data.results.slice() : [];
  // Lowest effective price first; missing prices go last.
  results.sort((a, b) => (a.effective_price ?? Infinity) - (b.effective_price ?? Infinity));

  if (data.region) out.append(el("div", "Showing stores for: " + data.region, "muted"));

  if (data.best_deal && data.best_deal.site) {
    const b = el("div", undefined, "card best");
    b.append(el("div", "Best deal", "muted"));
    const r = el("div", undefined, "row");
    r.append(el("span", data.best_deal.site, "site"), el("span", money(data.best_deal.effective_price, cur), "price"));
    b.append(r, el("div", data.best_deal.why || ""));
    out.append(b);
  }

  for (const item of results) {
    const c = el("div", undefined, "card");
    const r = el("div", undefined, "row");
    r.append(el("span", item.site || "Unknown store", "site"), el("span", money(item.effective_price, cur), "price"));
    c.append(r);
    const kind = [item.store_type, item.location].filter(Boolean).join(", ");
    if (kind) c.append(el("div", kind, "muted"));
    c.append(el("div", "Listed price: " + money(item.price, cur), "muted"));
    if (item.in_stock === false) c.append(el("div", "Out of stock", "oos"));
    if (Array.isArray(item.offers) && item.offers.length) {
      const ul = el("ul");
      item.offers.forEach(o => ul.append(el("li", String(o))));
      c.append(ul);
    }
    // Only link to real http(s) URLs.
    if (typeof item.url === "string" && item.url.startsWith("http")) {
      const a = el("a", "Open product", "open");
      a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      c.append(a);
    }
    out.append(c);
  }
  if (!results.length) out.append(el("div", "No verified prices found.", "card"));
  if (data.notes) out.append(el("div", String(data.notes), "card muted"));
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function call(url, opts) {
  const res = await fetch(url, opts);
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Request failed (" + res.status + ").");
  return d;
}
let last = null; // the search the user submitted

function svgEl(tag) {
  return document.createElementNS("http://www.w3.org/2000/svg", tag);
}

function renderHistory(h) {
  const c = el("div", undefined, "card history");
  c.append(el("h2", "90-day price history"));
  c.append(el("div", "Lowest recorded: " + money(h.lowest.price, h.lowest.currency) +
    " at " + h.lowest.store + " (" + h.lowest.date + "), from " + h.days.length + " days of data.", "muted"));

  const days = (Array.isArray(h.days) ? h.days : []).filter(d => typeof d.low === "number" && isFinite(d.low));
  if (days.length > 1) {
    const width = 240, height = 72, pad = 8;
    const lows = days.map(d => d.low);
    const min = Math.min(...lows), max = Math.max(...lows), span = max - min || 1;
    const pts = days.map((d, i) => ({
      day: d.day,
      low: d.low,
      x: pad + (i * (width - pad * 2)) / (days.length - 1),
      y: height - pad - ((d.low - min) / span) * (height - pad * 2)
    }));

    const svg = svgEl("svg");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Daily lowest effective price chart for the last 90 days.");
    const title = svgEl("title");
    title.textContent = "Daily lowest effective prices from " + days[0].day + " to " + days[days.length - 1].day;
    svg.append(title);

    [pad, height / 2, height - pad].forEach(y => {
      const line = svgEl("line");
      line.setAttribute("class", "grid");
      line.setAttribute("x1", pad);
      line.setAttribute("x2", width - pad);
      line.setAttribute("y1", y.toFixed(1));
      line.setAttribute("y2", y.toFixed(1));
      svg.append(line);
    });

    const path = svgEl("path");
    path.setAttribute("class", "spark");
    path.setAttribute("d", pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" "));
    svg.append(path);

    pts.forEach(p => {
      const dot = svgEl("circle");
      dot.setAttribute("cx", p.x.toFixed(1));
      dot.setAttribute("cy", p.y.toFixed(1));
      dot.setAttribute("r", "3");
      const label = svgEl("title");
      label.textContent = p.day + ": " + money(p.low, h.lowest.currency);
      dot.append(label);
      svg.append(dot);
    });
    c.append(svg);

    const cap = el("div", undefined, "caption muted");
    cap.append(el("span", days[0].day), el("span", days[days.length - 1].day));
    c.append(cap);
  } else {
    c.append(el("div", "The chart appears after there are at least two fresh price checks for this product and region.", "muted"));
  }
  return c;
}

// The server runs slow searches in a background thread; we start a job and poll it.
async function runJob(kind, message) {
  let job = await call("/api/jobs", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({...last, kind})});
  const t0 = Date.now();
  while (job.status === "queued" || job.status === "running") {
    if (Date.now() - t0 > 240000) throw new Error("Still running after 4 minutes. Try again later.");
    status.textContent = job.status === "queued" ? "Waiting in the queue…" : message;
    await sleep(3000);
    job = await call("/api/jobs/" + encodeURIComponent(job.job_id));
  }
  if (job.status === "error") throw new Error(job.error || "The request failed.");
  return job;
}

// Show the lowest price recorded for this product and region (data builds up as people search).
async function showHistory() {
  try {
    const p = new URLSearchParams({product: last.product, country: last.country, city: last.city || ""});
    const h = await call("/api/history?" + p);
    if (h.lowest && h.days.length) out.append(renderHistory(h));
  } catch (e) { /* history is optional */ }
}

// --- reviews and similar products ---
function card(title) { const c = el("div", undefined, "card"); c.append(el("h2", title)); return c; }
function list(items) { const ul = el("ul"); items.forEach(i => ul.append(el("li", String(i)))); return ul; }
function openLink(text, url) {
  if (typeof url !== "string" || !url.startsWith("http")) return null;   // only real http(s) links
  const a = el("a", text, "open"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a;
}
const GROUPS = [["publication", "Newspaper and publication reviews"], ["video", "Video reviews"], ["user", "User reviews"], ["other", "Other sources"]];

function renderInsights(d) {
  insights.replaceChildren();
  if (d.verdict) { const c = card("Why people buy it"); c.append(el("div", d.verdict)); insights.append(c); }
  if ((d.pros || []).length || (d.cons || []).length) {
    const c = card("What reviewers say");
    if (d.pros.length) { c.append(el("div", "Praised for", "muted"), list(d.pros)); }
    if (d.cons.length) { c.append(el("div", "Criticised for", "muted"), list(d.cons)); }
    insights.append(c);
  }
  const ur = d.user_rating;
  if (ur && ur.average != null) {
    const c = card("User rating");
    c.append(el("div", ur.average + " out of 5" + (ur.count != null ? " from " + ur.count.toLocaleString() + " ratings" : "") + (ur.where ? " on " + ur.where : "")));
    insights.append(c);
  }
  for (const [type, title] of GROUPS) {
    const items = (d.reviews || []).filter(r => r.source_type === type);
    if (!items.length) continue;
    const c = card(title);
    for (const r of items) {
      const row = el("div", undefined, "row");
      row.append(el("span", [r.source, r.reviewer].filter(Boolean).join(" - "), "site"), el("span", r.rating || "", "muted"));
      c.append(row, el("div", r.summary));
      const tags = [r.date, r.basis === "snippet_only" ? "based on a snippet only" : "", r.sponsored_or_affiliate ? "sponsored or affiliate" : ""].filter(Boolean).join(" · ");
      if (tags) c.append(el("div", tags, "muted"));
      const a = openLink("Open source", r.url); if (a) c.append(a);
    }
    insights.append(c);
  }
  if ((d.alternatives || []).length) {
    const c = card("Similar products worth considering");
    for (const x of d.alternatives) {
      const row = el("div", undefined, "row");
      row.append(el("span", x.name, "site"), el("span", x.approx_price != null ? money(x.approx_price, x.currency || d.currency) : "", "price"));
      c.append(row, el("div", x.why_consider));
      if ((x.better_at || []).length) c.append(el("div", "Better at: " + x.better_at.join(", "), "muted"));
      if (x.trade_off) c.append(el("div", "Trade-off: " + x.trade_off, "muted"));
      const a = openLink("Learn more", x.url); if (a) c.append(a);
    }
    insights.append(c);
  }
  if (!(d.reviews || []).length) insights.append(el("div", "No verifiable reviews were found.", "card"));
  if (d.notes) insights.append(el("div", String(d.notes), "card muted"));
  insights.append(el("div", "Summaries come from public pages and may be incomplete. Sponsored content and fake reviews exist: open the sources and compare several before buying.", "card muted"));
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; out.replaceChildren(); insights.replaceChildren(); $("ins").hidden = true; status.className = "";
  last = {product: q.value.trim(), country: country.value.trim(), city: city.value.trim() || null};
  try { localStorage.setItem("pa_country", last.country); localStorage.setItem("pa_city", last.city || ""); } catch (e) {}
  try {
    const job = await runJob("prices", "Finding stores in your region and checking prices… This takes 30-60 seconds.");
    status.textContent = job.cached ? "Showing a recent result (under 30 minutes old)." : "";
    render(job.result);
    $("ins").hidden = false;
    showHistory();
  } catch (err) {
    status.className = "error"; status.textContent = err.message;
  } finally { go.disabled = false; }
});

$("ins").addEventListener("click", async () => {
  $("ins").disabled = true; status.className = "";
  try {
    const job = await runJob("insights", "Reading reviews and looking for similar products… up to a minute.");
    status.textContent = "";
    renderInsights(job.result);
  } catch (err) {
    status.className = "error"; status.textContent = err.message;
  } finally { $("ins").disabled = false; }
});
</script>
</body>
</html>
