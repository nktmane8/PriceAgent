databases:
  - name: price-agent-db
    plan: free
    region: oregon
    databaseName: price_agent
    user: price_agent

services:
  - type: web
    name: price-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: price-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: price-agent-queue
          property: connectionString
      - key: QUEUE_NAME
        value: price-agent
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: API_KEYS
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: NOMINATIM_CONTACT
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: worker
    name: price-agent-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: price-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: price-agent-queue
          property: connectionString
      - key: QUEUE_NAME
        value: price-agent
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: keyvalue
    name: price-agent-queue
    plan: 256mb
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
