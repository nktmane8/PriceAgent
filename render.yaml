databases:
  - name: price-agent-db
    plan: free
    region: oregon
    databaseName: price_agent_db
    user: price_agent_db_user

services:
  - type: web
    name: price-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: FREE_RENDER
        value: "true"
      - key: WORKERS
        value: "1"
      - key: AI_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: price-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_VERIFICATION
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NOMINATIM_CONTACT
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
